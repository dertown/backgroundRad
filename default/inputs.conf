[script://./bin/fetch_gov_radiation.py]
disabled = 0
interval = 900
sourcetype = gov:radiation:json
source = gov_radiation
index = radsensor
python.version = python3

# EPA RadNet publishes hourly, one ~650 KB CSV per city, so poll it once an hour.
[script://./bin/fetch_gov_radiation.py --sources radnet]
disabled = 0
interval = 3600
sourcetype = gov:radiation:json
source = gov_radiation_radnet
index = radsensor
python.version = python3
